<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>经典贪吃蛇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 禁用双击缩放和选择，优化移动端体验 */
        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* 游戏画布样式 */
        #gameCanvas {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
            image-rendering: pixelated; /* 保持像素风格锐利 */
        }

        /* 移动端控制按钮的点击反馈 */
        .d-pad-btn:active {
            background-color: rgba(75, 85, 99, 0.8);
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col items-center justify-center overflow-hidden font-sans">

    <div class="max-w-md w-full px-4 flex flex-col items-center">
        
        <!-- 头部信息栏 (分数) -->
        <div class="w-full flex justify-between items-end mb-4 px-2">
            <div>
                <h1 class="text-3xl font-bold text-green-400 tracking-wider">贪吃蛇</h1>
            </div>
            <div class="text-right flex gap-4">
                <div class="bg-gray-800 rounded-lg px-3 py-1 border border-gray-700">
                    <p class="text-xs text-gray-400 uppercase tracking-wider">当前分数</p>
                    <p id="score" class="text-xl font-bold text-white text-center">0</p>
                </div>
                <div class="bg-gray-800 rounded-lg px-3 py-1 border border-gray-700">
                    <p class="text-xs text-gray-400 uppercase tracking-wider">最高分</p>
                    <p id="highScore" class="text-xl font-bold text-yellow-400 text-center">0</p>
                </div>
            </div>
        </div>

        <!-- 游戏区域容器 -->
        <div class="relative w-full aspect-square max-w-[400px] mx-auto bg-gray-800 rounded-xl border-4 border-gray-700 overflow-hidden">
            <canvas id="gameCanvas" width="400" height="400" class="w-full h-full bg-gray-900 block"></canvas>
            
            <!-- 开始/结束 浮层 -->
            <div id="overlay" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center z-10 backdrop-blur-sm transition-opacity duration-300">
                <h2 id="overlayTitle" class="text-4xl font-black text-white mb-2 shadow-sm text-center">准备好了吗？</h2>
                <p id="overlaySubtitle" class="text-gray-300 mb-6 text-center text-sm px-4">使用键盘方向键，<br>或屏幕上的方向盘控制移动</p>
                <button id="startBtn" class="bg-green-500 hover:bg-green-400 text-gray-900 font-bold py-3 px-8 rounded-full text-lg shadow-lg shadow-green-500/30 transition-all transform hover:scale-105 active:scale-95">
                    开始游戏
                </button>
            </div>
        </div>

        <!-- 移动端虚拟方向盘 (仅在较小屏幕上显眼，电脑上也可点击) -->
        <div class="mt-8 grid grid-cols-3 gap-2 w-48 sm:w-56 mx-auto pb-6">
            <div></div> <!-- 空白 -->
            <button class="d-pad-btn bg-gray-700 text-white rounded-xl aspect-square flex items-center justify-center text-2xl transition-colors border-b-4 border-gray-800 shadow-md" data-dir="up">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M213.66,165.66a8,8,0,0,1-11.32,0L128,91.31,53.66,165.66a8,8,0,0,1-11.32-11.32l80-80a8,8,0,0,1,11.32,0l80,80A8,8,0,0,1,213.66,165.66Z"></path></svg>
            </button>
            <div></div> <!-- 空白 -->
            
            <button class="d-pad-btn bg-gray-700 text-white rounded-xl aspect-square flex items-center justify-center text-2xl transition-colors border-b-4 border-gray-800 shadow-md" data-dir="left">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"></path></svg>
            </button>
            <button class="d-pad-btn bg-gray-700 text-white rounded-xl aspect-square flex items-center justify-center text-2xl transition-colors border-b-4 border-gray-800 shadow-md" data-dir="down">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path></svg>
            </button>
            <button class="d-pad-btn bg-gray-700 text-white rounded-xl aspect-square flex items-center justify-center text-2xl transition-colors border-b-4 border-gray-800 shadow-md" data-dir="right">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 256 256"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"></path></svg>
            </button>
        </div>

    </div>

    <script>
        // 游戏核心常量和变量
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 网格设置
        const gridSize = 20; // 每个网格的像素大小
        const tileCount = canvas.width / gridSize; // 一行/列有多少个网格 (20)
        
        // 游戏状态
        let snake = [];
        let dx = 0; // x轴速度
        let dy = 0; // y轴速度
        let foodX = 0;
        let foodY = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        
        let gameLoopTimeout;
        let isPlaying = false;
        let isGameOver = false;
        let baseSpeed = 120; // 初始刷新间隔 (毫秒)
        let currentSpeed = baseSpeed;

        // 缓存下一次的方向输入，避免在一个tick内按多次导致蛇头反向自杀
        let nextDx = 0;
        let nextDy = 0;

        // DOM 元素
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySubtitle = document.getElementById('overlaySubtitle');
        const startBtn = document.getElementById('startBtn');
        const dPadBtns = document.querySelectorAll('.d-pad-btn');

        // 初始化
        highScoreElement.textContent = highScore;

        // 重置游戏状态
        function resetGame() {
            snake = [
                {x: 10, y: 10},
                {x: 10, y: 11},
                {x: 10, y: 12}
            ];
            dx = 0;
            dy = -1; // 初始向上
            nextDx = 0;
            nextDy = -1;
            score = 0;
            currentSpeed = baseSpeed;
            scoreElement.textContent = score;
            isGameOver = false;
            placeFood();
        }

        // 生成食物坐标
        function placeFood() {
            foodX = Math.floor(Math.random() * tileCount);
            foodY = Math.floor(Math.random() * tileCount);
            
            // 确保食物不会生成在蛇身上
            let onSnake = false;
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === foodX && snake[i].y === foodY) {
                    onSnake = true;
                    break;
                }
            }
            if (onSnake) {
                placeFood();
            }
        }

        // 主游戏循环
        function drawGame() {
            if (!isPlaying) return;

            // 应用预存的方向 (防止自杀判定Bug)
            dx = nextDx;
            dy = nextDy;

            // 移动蛇
            const headX = snake[0].x + dx;
            const headY = snake[0].y + dy;

            // 检查碰撞 (墙壁)
            if (headX < 0 || headX >= tileCount || headY < 0 || headY >= tileCount) {
                gameOver();
                return;
            }

            // 检查碰撞 (自己身体)
            for (let i = 0; i < snake.length; i++) {
                if (headX === snake[i].x && headY === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            // 添加新蛇头
            snake.unshift({x: headX, y: headY});

            // 检查是否吃到食物
            if (headX === foodX && headY === foodY) {
                score += 10;
                scoreElement.textContent = score;
                // 增加难度 (最高速设个底限)
                if (currentSpeed > 60) {
                    currentSpeed -= 2; 
                }
                placeFood();
            } else {
                // 没吃到食物就移除尾巴
                snake.pop();
            }

            // 渲染画面
            clearScreen();
            drawFood();
            drawSnake();

            // 循环调用
            gameLoopTimeout = setTimeout(drawGame, currentSpeed);
        }

        // 清空画布
        function clearScreen() {
            // 背景颜色交替，产生淡淡的网格感 (可选，这里用纯色简化)
            ctx.fillStyle = '#111827'; // Tailwind gray-900
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // 绘制蛇
        function drawSnake() {
            snake.forEach((segment, index) => {
                // 蛇头颜色不同
                if (index === 0) {
                    ctx.fillStyle = '#4ade80'; // 浅绿 (头)
                } else {
                    // 身体产生渐变或不同的绿色效果
                    ctx.fillStyle = '#22c55e'; // 深绿 (身体)
                }

                // 稍微缩小一点点，让格子之间有空隙
                ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
                
                // 如果是蛇头，画两个小眼睛
                if (index === 0) {
                    ctx.fillStyle = '#111827'; // 黑眼珠
                    // 根据方向决定眼睛位置
                    let eyeSize = 3;
                    if (dx === 1) { // 右
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 4, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 13, eyeSize, eyeSize);
                    } else if (dx === -1) { // 左
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 4, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 13, eyeSize, eyeSize);
                    } else if (dy === 1) { // 下
                        ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 12, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 13, segment.y * gridSize + 12, eyeSize, eyeSize);
                    } else { // 上或初始
                        ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 13, segment.y * gridSize + 5, eyeSize, eyeSize);
                    }
                }
            });
        }

        // 绘制食物
        function drawFood() {
            ctx.fillStyle = '#ef4444'; // Tailwind red-500
            
            // 画个圆形的食物 (苹果)
            ctx.beginPath();
            const centerX = foodX * gridSize + gridSize / 2;
            const centerY = foodY * gridSize + gridSize / 2;
            ctx.arc(centerX, centerY, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            
            // 加个小叶子
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(centerX - 1, centerY - 8, 4, 3);
        }

        // 游戏结束处理
        function gameOver() {
            isPlaying = false;
            isGameOver = true;
            
            if (score > highScore) {
                highScore = score;
                highScoreElement.textContent = highScore;
                localStorage.setItem('snakeHighScore', highScore);
            }

            // 半透明滤镜
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 显示重新开始界面
            overlayTitle.textContent = "游戏结束!";
            overlayTitle.className = "text-4xl font-black text-red-500 mb-2 shadow-sm text-center";
            overlaySubtitle.innerHTML = `最终得分: <span class="font-bold text-white">${score}</span><br>再试一次？`;
            startBtn.textContent = "重新开始";
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            
            // 简单的动画效果
            setTimeout(() => {
                overlay.style.opacity = '1';
            }, 10);
        }

        // 开始游戏
        function startGame() {
            if (isPlaying) return;
            
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                resetGame();
                isPlaying = true;
                drawGame();
            }, 300);
        }

        // 键盘控制
        window.addEventListener('keydown', (e) => {
            // 防止滚动
            if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            handleInput(e.key);
        });

        // 触摸/按钮控制
        dPadBtns.forEach(btn => {
            // 同时支持 click 和 touchstart，防止延迟
            const triggerHandler = (e) => {
                e.preventDefault(); // 阻止多余的 click 或焦点问题
                const dir = btn.getAttribute('data-dir');
                let keyMapping = {
                    'up': 'ArrowUp',
                    'down': 'ArrowDown',
                    'left': 'ArrowLeft',
                    'right': 'ArrowRight'
                };
                handleInput(keyMapping[dir]);
            };
            btn.addEventListener('touchstart', triggerHandler, {passive: false});
            btn.addEventListener('mousedown', triggerHandler);
        });

        // 处理方向输入逻辑
        function handleInput(key) {
            // 如果在 Game Over 画面按回车或空格，重新开始
            if ((key === 'Enter' || key === ' ') && !isPlaying) {
                startGame();
                return;
            }

            if (!isPlaying) return;

            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if ((key === 'ArrowLeft' || key === 'a' || key === 'A') && !goingRight) {
                nextDx = -1;
                nextDy = 0;
            }
            if ((key === 'ArrowUp' || key === 'w' || key === 'W') && !goingDown) {
                nextDx = 0;
                nextDy = -1;
            }
            if ((key === 'ArrowRight' || key === 'd' || key === 'D') && !goingLeft) {
                nextDx = 1;
                nextDy = 0;
            }
            if ((key === 'ArrowDown' || key === 's' || key === 'S') && !goingUp) {
                nextDx = 0;
                nextDy = 1;
            }
        }

        // 绑定开始按钮
        startBtn.addEventListener('click', startGame);

        // 初始绘制空画布
        clearScreen();
        // 画个静态背景给点氛围
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.font = '20px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('准备就绪', canvas.width / 2, canvas.height / 2);

    </script>
</body>
</html>
